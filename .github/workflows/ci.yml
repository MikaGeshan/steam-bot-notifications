name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: steam_bot
          POSTGRES_USER: steam_bot
          POSTGRES_PASSWORD: steam_bot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steam_bot -d steam_bot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://steam_bot:steam_bot@localhost:5432/steam_bot
      USE_MOCK_PROVIDERS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test --coverage
      - run: bun run db:migrate
      - run: bun run test:integration
      - run: docker build -t steam-discount-notifications:test .
